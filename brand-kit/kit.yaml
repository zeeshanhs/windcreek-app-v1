known_gaps:
- Working evidence-led kit, not a client-approved brand manual; all authored rules have working authority.
- No source CSS, computed styles, loaded fonts, live mobile rendering or exercised source interactions. Browser
  navigation was blocked; no bypass attempted.
- Screenshot raster sizes are known, but original browser viewport, DPR, zoom and source capture dates are not established.
- Original logo, standalone wordmark/mark, favicon, photography, rewards-card art and decorative graphics are not
  delivered as reusable assets. Their reuse/sharing permissions remain unestablished.
- Favicon and official identity variant/clear-space rules were not inspected. No official font family is identified,
  and font binaries are excluded.
- The four supplied analytical reference sheets support typography, controls and grouping. Exact identity and photographic
  visual references remain incomplete; no visual fidelity claim is made for those roles.
- Authenticated applications and full editorial articles were not visually inspected. Their guidance is explicitly
  extended from public-page evidence.
- Some Rewards screenshot text is low-resolution; screenshots are visual references, not evergreen benefit amounts,
  eligibility or operating requirements.
- No dark theme, motion timing, source keyboard behavior, validation flow or loading/error state was visually verified.
  A source error string in fetched text is not a tested user-visible state.
- The project drawing is excluded from reusable brand guidance; no application or system-specific screens were designed.
